server {
  listen 80;
  root /usr/share/nginx/html;

  # Hashed assets never change: cache hard (saves clinic data bundles).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # API docs are also reachable from the screen's port.
  location ~ ^/(docs|docs-assets/|openapi\.json) {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'";
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
